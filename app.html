<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="app.css">
    <title>Weather Application</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <div class="all-weather-app">
        <div class="title">Welcome To My Weather App</div>
    
    <div class="app">
        <div id="app-container">
            <main>
                <div class="search-container">
                    <input type="text" placeholder="Search ...." class="search-bar" id="location-input">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <button class="btn" id="get-weather-btn">Get Weather</button>
                </div>
                <section class="data-container">
                    <div class="location-container">
                        <div class="cnt">
                            <div class="icone"><i class="fa-solid fa-location-dot"></i></div>
                            <div class="location" id="location"></div>
                        </div>
                        <div class="cnt">
                            <div class="icone"><i class="fa-regular fa-calendar-days"></i></div>
                            <div class="date" id="date"></div>
                        </div>
                    </div>
                    <div class="weather-container">
                        <div class="cnt">
                            <div class="icone"><i class="fa-solid fa-temperature-low"></i></div>
                            <div class="temperature" id="temperature-current"></div>
                        </div>
                        <div class="temperature" id="temperature-max-min"></div>
                        <div class="cnt">
                            <div class="icone">
                                <i class="fa-regular fa-sun"></i>
                                <i class="fa-solid fa-cloud"></i>
                                <i class="fa-solid fa-wind"></i>
                            </div>
                            <div class="weather" id="weather"></div>
                            <div class="weather-desc" id="weather-desc"></div>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
